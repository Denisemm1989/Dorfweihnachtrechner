<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8f1d1d"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>Dorfweihnacht Getränke Rechner</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fa;color:#172033;padding-bottom:72px}button,input{font:inherit;touch-action:manipulation}header{background:#941d1d;color:#fff;text-align:center;padding:10px}h1{font-size:21px;margin:0}.app{max-width:780px;margin:auto;padding:6px;display:grid;gap:6px}.card{background:#fff;border-radius:13px;padding:8px;box-shadow:0 2px 8px #0002}h2{font-size:16px;color:#8f1d1d;margin:0 0 7px}.pfandwahl,.produkte,.cash,.bar{display:grid;gap:6px}.pfandwahl,.produkte{grid-template-columns:1fr 1fr}.pfand{border:2px solid transparent;border-radius:10px;min-height:42px;font-weight:bold}.pfand.active{border-color:#111}.mit{background:#dceafe}.ohne{background:#e8ebef}.produkt{border:0;border-radius:12px;min-height:72px;padding:6px 4px;background:#ffcaca;color:#861414;box-shadow:0 2px 6px #0002}.orange{background:#ffedc8;color:#8b3b00}.violet{background:#e5dbff;color:#53249a}.white{background:#fff;color:#24324a;border:1px solid #cbd5e1}.correction{background:#ffe18a;color:#773400}.icon{font-size:22px;margin-right:4px}.name{font-size:14px;font-weight:900}.price{display:block;font-size:18px;font-weight:900;margin-top:4px}.empty{text-align:center;color:#687386;padding:10px}.row{display:grid;grid-template-columns:auto 1fr 34px 34px;gap:5px;align-items:center;padding:5px 0;border-bottom:1px solid #dfe5ed;font-size:12px}.qty{background:#f2f4f7;padding:4px 6px;border-radius:7px;font-weight:bold}.row button{border:0;border-radius:8px;font-size:20px}.minus{background:#ffe0e0;color:#a71111}.plus{background:#dcf5e4;color:#11672d}.sum,.statrow{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}.grand{display:flex;justify-content:space-between;background:#d9f7e3;color:#09632c;border-radius:10px;padding:7px 9px;font-size:21px;font-weight:900}.grand.negative{background:#ffe1e1;color:#a11218}.change{background:#eef6ff}.changegrid{display:grid;grid-template-columns:1.2fr 1fr;gap:6px}.money{width:100%;padding:7px;border:2px solid #8bbcf8;border-radius:9px;font-size:19px;text-align:right}.result{text-align:center;background:#fff;border-radius:9px;padding:5px}.result strong{display:block;font-size:22px;color:#1769d2}.cash{grid-template-columns:repeat(5,1fr);margin-top:5px}.cash button,.tools button,.undobtn,.danger{border:0;border-radius:8px;padding:8px;font-weight:bold}.cash button{background:#dceafe}.exact,.csvbtn{background:#1769d2!important;color:#fff}.refundgrid{display:grid;grid-template-columns:auto 38px 45px 38px 1fr;gap:6px;align-items:center}.refundgrid button{border:0;border-radius:8px;min-height:38px;font-weight:bold}.m{background:#c51d2a;color:#fff}.p{background:#14723a;color:#fff}.pay{background:#8a3d0c;color:#fff}.refundqty{text-align:center;border:1px solid #ccd3dc;border-radius:8px;padding:9px}.summarytop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.metric{background:#f4f6f9;border-radius:10px;padding:7px;font-size:11px}.metric strong{display:block;font-size:17px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.undobtn,.danger{width:100%;margin-top:6px}.undobtn{background:#ffd76b}.danger{background:#fff1f1;color:#a11218;border:1px solid #d71920}.stats{display:none;margin-top:7px}.stats.show{display:block}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:5px;z-index:20}.bar{max-width:780px;margin:auto;grid-template-columns:1fr 1.35fr}.action{border:0;border-radius:10px;min-height:47px;color:#fff;font-weight:900}.del{background:#a71919}.finish{background:#157238}.finish span{display:block;font-size:11px}@media(max-width:360px){.name{font-size:12px}.cash{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><h1>🎄 Dorfweihnacht Getränke Rechner</h1></header><main class="app">
<section class="card"><h2>1. Pfand wählen</h2><div class="pfandwahl"><button id="withDeposit" class="pfand mit active">✓ Mit 2 € Pfand</button><button id="withoutDeposit" class="pfand ohne">Ohne Pfand</button></div></section>
<section class="card"><h2>2. Artikel antippen</h2><div class="produkte" id="products"></div></section>
<section class="card"><h2>Aktuelle Bestellung</h2><div id="cart"></div><div class="sum"><span>Artikel</span><strong id="drinkSum"></strong></div><div class="sum"><span>Pfand</span><strong id="depositSum"></strong></div><div id="grandBox" class="grand"><span>GESAMT</span><span id="grandTotal"></span></div></section>
<section class="card change"><h2>💶 Rückgeld</h2><div class="changegrid"><input id="given" class="money" inputmode="decimal" placeholder="Kunde gibt"><div id="changeResult" class="result"></div></div><div class="cash"><button data-cash="5">5 €</button><button data-cash="10">10 €</button><button data-cash="20">20 €</button><button data-cash="50">50 €</button><button id="exact" class="exact">Passend</button></div></section>
<section class="card"><h2>🥤 Pfandrückgabe</h2><div class="refundgrid"><span>Becher</span><button id="refundMinus" class="m">−</button><div id="refundQty" class="refundqty">1</div><button id="refundPlus" class="p">+</button><button id="refundPay" class="pay">Pfand auszahlen</button></div></section>
<section class="card"><div class="summarytop"><div class="metric">Bestellungen<strong id="orders"></strong></div><div class="metric">Artikel<strong id="itemsSold"></strong></div><div class="metric">Umsatz<strong id="dailySales"></strong></div></div><div class="tools"><button id="toggleStats">📊 Tagesübersicht</button><button id="exportCsv" class="csvbtn">⬇ CSV speichern</button></div><button id="undoLast" class="undobtn">↶ Letzte Buchung zurücknehmen</button><div id="stats" class="stats"></div><button id="resetDay" class="danger">🗑 Alle Tageswerte zurücksetzen</button></section>
</main><div class="bottom"><div class="bar"><button id="deleteOrder" class="action del">✕ Bestellung löschen</button><button id="finishOrder" class="action finish">✓ Abschließen<span id="barTotal"></span></button></div></div>
<script>
(function(){'use strict';var catalog=[['Glühwein',4.5,1,'☕',''],['Glühwein + Schuss',5,1,'☕',''],['Punsch',4,1,'🍹','orange'],['Jagertee',5,1,'🫖',''],['Bier',3.5,1,'🍺',''],['Weinschorle',4,1,'🍷',''],['Wasser + Limo + Spezi',2.5,1,'🥤','orange'],['Schnaps',2.5,0,'🥃','violet'],['Schmalzbrot',2.5,0,'🥖','white']],names=catalog.map(function(x){return x[0]}),dep=true,cart=[],refundQty=1;function E(x){return document.getElementById(x)}function eur(n){return Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}function blank(){var c={};names.forEach(function(n){c[n]=0});return{sales:0,orders:0,refunds:0,depositTaken:0,counts:c,last:null}}function load(){try{var x=JSON.parse(localStorage.getItem('dorfweihnacht-v3')),b=blank();if(x){Object.assign(b,x);Object.assign(b.counts,x.counts||{})}return b}catch(e){return blank()}}var state=load();function save(){localStorage.setItem('dorfweihnacht-v3',JSON.stringify(state))}function snap(){return{sales:state.sales,orders:state.orders,refunds:state.refunds,depositTaken:state.depositTaken,counts:Object.assign({},state.counts),last:null}}function totals(){var a=0,p=0;cart.forEach(function(x){if(x.kind==='correction')p+=x.deposit*x.qty;else{a+=x.price*x.qty;p+=x.deposit*x.qty}});return{a:a,p:p,t:a+p}}function add(n,price,deposit,icon,kind){var key=n+'-'+deposit+'-'+kind,f=cart.find(function(x){return x.key===key});if(f)f.qty++;else cart.push({key:key,name:n,price:price,deposit:deposit,icon:icon,kind:kind,qty:1});render()}function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);render()}function render(){var t=totals(),box=E('cart');box.innerHTML=cart.length?'':'<div class="empty">Noch keine Artikel ausgewählt.</div>';cart.forEach(function(x,i){var unit=x.kind==='correction'?x.deposit:x.price+x.deposit,r=document.createElement('div');r.className='row';r.innerHTML='<b class="qty">'+x.qty+'×</b><span><b>'+x.icon+' '+x.name+'</b><br><small>'+(x.kind==='correction'?'Pfand reduzieren':x.deposit?'mit Pfand':'ohne Pfand')+' · '+eur(unit)+'</small></span><button class="minus">−</button><button class="plus">+</button>';r.querySelector('.minus').onclick=function(){changeQty(i,-1)};r.querySelector('.plus').onclick=function(){changeQty(i,1)};box.appendChild(r)});E('drinkSum').textContent=eur(t.a);E('depositSum').textContent=eur(t.p);E('grandTotal').textContent=eur(t.t);E('barTotal').textContent=eur(t.t);E('grandBox').classList.toggle('negative',t.t<0);E('orders').textContent=state.orders;E('itemsSold').textContent=names.reduce(function(a,n){return a+(state.counts[n]||0)},0);E('dailySales').textContent=eur(state.sales);E('refundQty').textContent=refundQty;var g=parseFloat(E('given').value.replace(',','.'))||0,d=g-t.t;E('changeResult').innerHTML=!g?'Rückgeld<strong>0,00 €</strong>':d<0?'Noch offen<strong>'+eur(-d)+'</strong>':'Rückgeld<strong>'+eur(d)+'</strong>';var h='<div class="statrow"><b>Verkäufe pro Artikel</b><b>Anzahl</b></div>';names.forEach(function(n){h+='<div class="statrow"><span>'+n+'</span><b>'+(state.counts[n]||0)+'</b></div>'});h+='<div class="statrow"><span>Pfand kassiert</span><b>'+eur(state.depositTaken)+'</b></div><div class="statrow"><span>Pfand ausgezahlt</span><b>'+eur(state.refunds)+'</b></div>';E('stats').innerHTML=h}var ph=E('products');catalog.forEach(function(x){var b=document.createElement('button');b.className='produkt '+x[4];b.innerHTML='<span class="icon">'+x[3]+'</span><span class="name">'+x[0]+'</span><span class="price">'+eur(x[1])+'</span>';b.onclick=function(){add(x[0],x[1],x[2]&&dep?2:0,x[3],'item')};ph.appendChild(b)});var corr=document.createElement('button');corr.className='produkt correction';corr.innerHTML='<span class="icon">↩️</span><span class="name">Pfandkorrektur</span><span class="price">−2,00 €</span>';corr.onclick=function(){add('Pfandkorrektur',0,-2,'↩️','correction')};ph.appendChild(corr);E('withDeposit').onclick=function(){dep=true;this.classList.add('active');E('withoutDeposit').classList.remove('active')};E('withoutDeposit').onclick=function(){dep=false;this.classList.add('active');E('withDeposit').classList.remove('active')};document.querySelectorAll('[data-cash]').forEach(function(b){b.onclick=function(){E('given').value=b.dataset.cash;render()}});E('given').oninput=render;E('exact').onclick=function(){E('given').value=totals().t.toFixed(2).replace('.',',');render()};E('deleteOrder').onclick=function(){cart=[];E('given').value='';render()};E('finishOrder').onclick=function(){var t=totals(),g=parseFloat(E('given').value.replace(',','.'))||0;if(!cart.length)return alert('Bitte zuerst mindestens einen Artikel auswählen.');if(t.t<0&&!confirm('Der Gesamtbetrag ist negativ ('+eur(t.t)+'). Trotzdem abschließen?'))return;if(g>0&&g<t.t)return alert('Der gegebene Betrag reicht noch nicht aus.');var before=snap();cart.forEach(function(x){if(names.indexOf(x.name)>=0)state.counts[x.name]=(state.counts[x.name]||0)+x.qty});state.sales+=t.t;state.depositTaken+=t.p;state.orders++;state.last={before:before,type:'sale'};save();cart=[];E('given').value='';render()};E('refundMinus').onclick=function(){if(refundQty>1)refundQty--;render()};E('refundPlus').onclick=function(){refundQty++;render()};E('refundPay').onclick=function(){var before=snap(),amount=refundQty*2;state.refunds+=amount;state.sales-=amount;state.last={before:before,type:'refund'};save();refundQty=1;render()};E('undoLast').onclick=function(){if(!state.last)return alert('Keine letzte Buchung vorhanden.');if(confirm('Letzte Buchung wirklich zurücknehmen?')){state=state.last.before;save();render()}};E('toggleStats').onclick=function(){E('stats').classList.toggle('show')};E('resetDay').onclick=function(){if(confirm('Wirklich alle Tageswerte löschen?')){state=blank();save();render()}};E('exportCsv').onclick=function(){var rows=[['Dorfweihnacht Tagesabschluss'],['Bestellungen',state.orders],['Umsatz',state.sales.toFixed(2)],['Pfand kassiert',state.depositTaken.toFixed(2)],['Pfand ausgezahlt',state.refunds.toFixed(2)],[],['Artikel','Anzahl']];names.forEach(function(n){rows.push([n,state.counts[n]||0])});var csv='\ufeff'+rows.map(function(r){return r.map(function(v){return '"'+v+'"'}).join(';')}).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Dorfweihnacht_Tagesabschluss.csv';a.click()};if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js')});render()})();
</script></body></html>
