<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7f1d1d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Dorfweihnacht">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>Dorfweihnacht Getränke Rechner</title>
<style>
:root{--r:#991b1b;--dr:#7f1d1d;--g:#166534;--b:#1d4ed8;--t:#1f2937}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;color:var(--t);background:#f8fafc;padding-bottom:70px}button,input{font:inherit;touch-action:manipulation}header{background:linear-gradient(135deg,var(--dr),var(--r));color:#fff;text-align:center;padding:calc(7px + env(safe-area-inset-top)) 8px 7px}header h1{font-size:20px;margin:0}.app{max-width:780px;margin:auto;padding:5px;display:flex;flex-direction:column;gap:5px}.card{background:#fff;border-radius:11px;padding:7px;box-shadow:0 2px 7px #0002}h2{font-size:15px;color:var(--dr);margin:0 0 5px}.pfandwahl,.produkte,.cash,.bar{display:grid;gap:5px}.pfandwahl{grid-template-columns:1fr 1fr}.pfand{border:2px solid transparent;border-radius:9px;min-height:39px;font-size:13px;font-weight:bold}.pfand.active{border-color:#111}.mit{background:#dbeafe;color:#1e3a8a}.ohne{background:#e5e7eb}.produkte{grid-template-columns:1fr 1fr}.produkt{border:0;border-radius:10px;min-height:61px;padding:5px 3px;background:#fecaca;color:#7f1d1d;box-shadow:0 2px 5px #0002}.produkt.orange{background:#ffedd5;color:#7c2d12}.produkt.violet{background:#ede9fe;color:#5b21b6}.produkt.white{background:#fff;color:#374151;border:1px solid #cbd5e1}.name{display:block;font-size:13px;font-weight:900;line-height:1.05}.price{display:block;font-size:17px;font-weight:800;margin-top:3px}.bon{max-height:80px;overflow:auto}.empty{text-align:center;color:#6b7280;padding:7px;font-size:12px}.row{display:grid;grid-template-columns:auto 1fr 31px 31px;gap:4px;align-items:center;padding:3px 0;border-bottom:1px solid #e5e7eb;font-size:11px}.qty{background:#f3f4f6;padding:3px 4px;border-radius:6px;font-weight:bold}.row button{border:0;border-radius:6px;height:30px;font-size:18px;font-weight:bold}.minus{background:#fee2e2;color:#991b1b}.plus{background:#dcfce7;color:#166534}.sum{display:flex;justify-content:space-between;font-size:12px}.grand{display:flex;justify-content:space-between;background:#dcfce7;color:#166534;border-radius:8px;padding:5px 7px;margin-top:3px;font-size:19px;font-weight:900}.change{background:#eff6ff;border:1px solid #bfdbfe}.changegrid{display:grid;grid-template-columns:1.2fr 1fr;gap:5px}.money{width:100%;padding:5px;border:1px solid #93c5fd;border-radius:7px;font-size:17px;font-weight:bold;text-align:right}.result{text-align:center;background:#fff;border-radius:7px;padding:3px;font-size:11px}.result strong{display:block;font-size:20px;color:var(--b)}.cash{grid-template-columns:repeat(4,1fr);margin-top:4px}.cash button{border:0;border-radius:7px;min-height:30px;background:#dbeafe;color:#1e3a8a;font-size:13px;font-weight:bold}.refund{width:100%;border:0;border-radius:9px;padding:7px;background:#78350f;color:#fff;font-size:13px;font-weight:bold}.status{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;font-size:10px;padding:5px}.status strong{display:block;margin-top:2px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid #ddd;padding:5px 6px calc(5px + env(safe-area-inset-bottom));z-index:20}.bar{max-width:780px;margin:auto;grid-template-columns:1fr 1.35fr}.action{border:0;border-radius:9px;min-height:44px;color:#fff;font-size:13px;font-weight:900}.del{background:var(--r)}.finish{background:var(--g)}.finish span{display:block;font-size:10px}@media(min-width:600px){.produkte{grid-template-columns:repeat(4,1fr)}}@media(max-height:680px){.produkt{min-height:55px}.bon{max-height:60px}}
</style></head>
<body><header><h1>🎄 Dorfweihnacht Getränke Rechner</h1></header><main class="app">
<section class="card"><h2>1. Pfand wählen</h2><div class="pfandwahl"><button id="withDeposit" class="pfand mit active">✓ Mit 2 € Pfand</button><button id="withoutDeposit" class="pfand ohne">Ohne Pfand</button></div></section>
<section class="card"><h2>2. Artikel antippen</h2><div class="produkte">
<button class="produkt" data-name="Glühwein" data-price="4.5" data-deposit="1"><span class="name">Glühwein</span><span class="price">4,50 €</span></button>
<button class="produkt" data-name="Glühwein + Schuss" data-price="5" data-deposit="1"><span class="name">Glühwein + Schuss</span><span class="price">5,00 €</span></button>
<button class="produkt orange" data-name="Punsch" data-price="4" data-deposit="1"><span class="name">Punsch</span><span class="price">4,00 €</span></button>
<button class="produkt" data-name="Jagertee" data-price="5" data-deposit="1"><span class="name">Jagertee</span><span class="price">5,00 €</span></button>
<button class="produkt" data-name="Bier" data-price="3.5" data-deposit="1"><span class="name">Bier</span><span class="price">3,50 €</span></button>
<button class="produkt" data-name="Weinschorle" data-price="4" data-deposit="1"><span class="name">Weinschorle</span><span class="price">4,00 €</span></button>
<button class="produkt orange" data-name="Wasser + Limo + Spezi" data-price="2.5" data-deposit="1"><span class="name">Wasser + Limo + Spezi</span><span class="price">2,50 €</span></button>
<button class="produkt white" data-name="Schmalzbrot" data-price="2.5" data-deposit="0"><span class="name">Schmalzbrot</span><span class="price">2,50 €</span></button>
<button class="produkt violet" data-name="Schnaps" data-price="2.5" data-deposit="0"><span class="name">Schnaps</span><span class="price">2,50 €</span></button>
</div></section>
<section class="card"><h2>Aktuelle Bestellung</h2><div id="cart" class="bon"></div><div class="sum"><span>Artikel</span><strong id="drinkSum">0,00 €</strong></div><div class="sum"><span>Pfand</span><strong id="depositSum">0,00 €</strong></div><div class="grand"><span>GESAMT</span><span id="grandTotal">0,00 €</span></div></section>
<section class="card change"><h2>💶 Rückgeld</h2><div class="changegrid"><div><input id="given" class="money" inputmode="decimal" placeholder="Kunde gibt"></div><div id="changeResult" class="result">Rückgeld<strong>0,00 €</strong></div></div><div class="cash"><button data-cash="5">5 €</button><button data-cash="10">10 €</button><button data-cash="20">20 €</button><button data-cash="50">50 €</button></div></section>
<button id="depositReturn" class="refund">↩ 2,00 € Pfand zurückzahlen</button>
<section class="status"><div>Bestellungen<strong id="orders">0</strong></div><div>Tagesumsatz<strong id="dailySales">0,00 €</strong></div><div>Pfandrückgabe<strong id="depositRefunds">0,00 €</strong></div></section>
</main><div class="bottom"><div class="bar"><button id="deleteOrder" class="action del">✕ Löschen</button><button id="finishOrder" class="action finish">✓ Abschließen<span id="barTotal">0,00 €</span></button></div></div>
<script>
(function(){'use strict';var dep=true,cart=[],state=load();function E(x){return document.getElementById(x)}function eur(n){return Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}function load(){try{return JSON.parse(localStorage.getItem('dorfweihnacht-state'))||{sales:0,orders:0,refunds:0}}catch(e){return{sales:0,orders:0,refunds:0}}}function save(){localStorage.setItem('dorfweihnacht-state',JSON.stringify(state))}function totals(){var a=0,p=0;cart.forEach(function(x){a+=x.price*x.qty;p+=x.deposit*x.qty});return{a:a,p:p,t:a+p}}function setDep(v){dep=v;E('withDeposit').classList.toggle('active',v);E('withoutDeposit').classList.toggle('active',!v)}function add(b){var n=b.dataset.name,pr=Number(b.dataset.price),d=b.dataset.deposit==='1'&&dep?2:0,k=n+'-'+d,f=cart.find(function(x){return x.key===k});if(f)f.qty++;else cart.push({key:k,name:n,price:pr,deposit:d,qty:1});render()}function qty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);render()}function render(){var box=E('cart'),t=totals();box.innerHTML='';if(!cart.length)box.innerHTML='<div class="empty">Noch keine Artikel ausgewählt.</div>';else cart.forEach(function(x,i){var r=document.createElement('div');r.className='row';r.innerHTML='<span class="qty">'+x.qty+'×</span><span><strong>'+x.name+'</strong><br><small>'+(x.deposit?'mit Pfand':'ohne Pfand')+' · '+eur(x.price+x.deposit)+'</small></span><button class="minus">−</button><button class="plus">+</button>';r.querySelector('.minus').onclick=function(){qty(i,-1)};r.querySelector('.plus').onclick=function(){qty(i,1)};box.appendChild(r)});E('drinkSum').textContent=eur(t.a);E('depositSum').textContent=eur(t.p);E('grandTotal').textContent=eur(t.t);E('barTotal').textContent=eur(t.t);E('orders').textContent=state.orders;E('dailySales').textContent=eur(state.sales);E('depositRefunds').textContent=eur(state.refunds);change()}function given(){var n=Number(E('given').value.trim().replace(',','.'));return Number.isFinite(n)?n:0}function change(){var g=given(),d=g-totals().t,r=E('changeResult');if(!g){r.innerHTML='Rückgeld<strong>0,00 €</strong>';r.style.background='#fff'}else if(d<0){r.innerHTML='Noch offen<strong>'+eur(-d)+'</strong>';r.style.background='#fee2e2'}else{r.innerHTML='Rückgeld<strong>'+eur(d)+'</strong>';r.style.background='#dcfce7'}}document.querySelectorAll('.produkt').forEach(function(b){b.onclick=function(){add(b)}});document.querySelectorAll('[data-cash]').forEach(function(b){b.onclick=function(){E('given').value=Number(b.dataset.cash).toFixed(2).replace('.',',');change()}});E('withDeposit').onclick=function(){setDep(true)};E('withoutDeposit').onclick=function(){setDep(false)};E('given').oninput=change;E('deleteOrder').onclick=function(){cart=[];E('given').value='';render()};E('finishOrder').onclick=function(){var t=totals(),g=given();if(t.t<=0)return alert('Bitte zuerst mindestens einen Artikel auswählen.');if(g>0&&g<t.t)return alert('Der gegebene Betrag reicht noch nicht aus.');state.sales+=t.t;state.orders++;save();cart=[];E('given').value='';render()};E('depositReturn').onclick=function(){state.refunds+=2;state.sales-=2;save();render()};if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./service-worker.js')});render()})();
</script></body></html>
